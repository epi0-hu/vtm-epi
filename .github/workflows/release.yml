name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Vampire: The Masquerade ${{ github.ref_name }}
          files: build/libs/vtm-*.jar
          body: |
            NeoForge mod for Minecraft 1.21.1.

            **Requires** NeoForge for 1.21.1 and **GeckoLib 4.9.3+** (not bundled). Install on both server and clients.

            See the README for features.
